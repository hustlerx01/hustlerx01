<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-label="footer: logout, session ended cleanly" shape-rendering="crispEdges">
<defs><style>@font-face{font-family:'PxSilk';src:url(data:font/ttf;base64,) format('truetype');} text{font-kerning:none;-webkit-font-smoothing:none;}</style>
<pattern id="dith" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#1a1a1a"/><rect x="2" y="2" width="2" height="2" fill="#1a1a1a"/></pattern>
<pattern id="dith2" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#2a2a2a"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect y="0" width="4" height="2" fill="#000" fill-opacity=".35"/></pattern>
</defs>
<rect width="1200" height="110" fill="#0a0a0a"/>
<rect x="40" y="8" width="1120" height="90" fill="#1a1a1a"/><rect x="36" y="12" width="1128" height="82" fill="#1a1a1a"/><rect x="40" y="12" width="1120" height="82" fill="#0a0a0a"/><text x="64" y="44" font-family="PxSilk" font-size="16" fill="#eaeaea"><tspan fill="#fff">ansar@hustlerx</tspan><tspan fill="#555">:~$</tspan> logout</text><text x="64" y="72" font-family="PxSilk" font-size="12" fill="#555" text-anchor="start" >[connection to hustlerx closed]</text><rect x="908" y="62" width="8" height="8" fill="#eaeaea"><animate attributeName="opacity" values="1;0" keyTimes="0;.5" calcMode="discrete" dur="1.2s" repeatCount="indefinite"/></rect><text x="1136" y="72" font-family="PxSilk" font-size="12" fill="#888" text-anchor="end" >session ended cleanly</text><rect x="40" y="12" width="1120" height="82" fill="url(#scan)"/>
</svg>