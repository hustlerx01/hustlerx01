  <rect x="40" y="30" width="1120" height="260" rx="10" fill="#0f172a" stroke="#1e293b"/>
  <rect x="40" y="30" width="1120" height="34" rx="10" fill="#111c33"/>
  <rect x="40" y="54" width="1120" height="10" fill="#111c33"/>
  <circle cx="64" cy="47" r="5.5" fill="#475569"/><circle cx="84" cy="47" r="5.5" fill="#475569"/><circle cx="104" cy="47" r="5.5" fill="#5eead4"/>
  <text x="600" y="51" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace" font-size="12" fill="#64748b" text-anchor="middle">ansar@hustlerx: ~ (ssh)</text>
  <g font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,Menlo,monospace">
    <text x="80" y="106" font-size="15" fill="#e2e8f0" clip-path="url(#t1)"><tspan fill="#5eead4">ansar@hustlerx</tspan><tspan fill="#64748b">:</tspan><tspan fill="#3b82f6">~</tspan><tspan fill="#64748b">$ </tspan>whoami --verbose</text>
    <text x="80" y="160" font-size="44" font-weight="700" fill="#e2e8f0">Ansar Shaikh</text>
    <text x="80" y="188" font-size="15" fill="#94a3b8">security researcher · CTF player · Pune</text>
    <text x="80" y="218" font-size="15" fill="#e2e8f0" clip-path="url(#t2)"><tspan fill="#5eead4">ansar@hustlerx</tspan><tspan fill="#64748b">:</tspan><tspan fill="#3b82f6">~</tspan><tspan fill="#64748b">$ </tspan>tail -f detections.log</text>
    <rect x="80" y="232" width="9" height="16" fill="#5eead4"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
    <text x="1120" y="266" font-size="11" fill="#64748b" text-anchor="end">github.com/hustlerx01 · hustlerx.si</text>
