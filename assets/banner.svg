    <text x="16" y="24" font-size="11" fill="#64748b">-- status ---------------------</text>
    <text x="16" y="52" fill="#94a3b8">focus  <tspan fill="#e2e8f0">detection · cloud · AI sec</tspan></text>
    <text x="16" y="76" fill="#94a3b8">tools  <tspan fill="#e2e8f0">wazuh · sigma · suricata</tspan></text>
    <text x="16" y="100" fill="#94a3b8">cert   <tspan fill="#e2e8f0">CEH Practical</tspan></text>
