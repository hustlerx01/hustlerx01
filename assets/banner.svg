    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5eead4" stop-opacity="0"/><stop offset=".5" stop-color="#5eead4" stop-opacity=".18"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></linearGradient>
    <clipPath id="win"><rect x="40" y="30" width="1120" height="260" rx="10"/></clipPath>
    <clipPath id="t1"><rect x="80" y="88" height="24" width="0"><animate attributeName="width" values="560;0;560;560" keyTimes="0;.04;.35;1" dur="6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="t2"><rect x="80" y="200" height="24" width="0"><animate attributeName="width" values="560;0;0;560;560" keyTimes="0;.04;.45;.8;1" dur="6s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="1200" height="320" fill="#0b1220"/>
